# Minimal dub stack: URL shortening only.
# Analytics (Tinybird), background jobs (QStash) and billing are deliberately absent.
services:
  dub:
    image: ${DUB_IMAGE:-ghcr.io/caelusworks/dub:staging-latest}
    restart: unless-stopped
    ports:
      - "${DUB_HOST_PORT:-3010}:3000"
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:3000/api/health').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 40s
    environment:
      NEXTAUTH_URL: '${NEXTAUTH_URL}'
      NEXTAUTH_SECRET: '${NEXTAUTH_SECRET}'
      ENCRYPTION_KEY: '${ENCRYPTION_KEY}'
      DATABASE_URL: 'mysql://root:${DB_ROOT_PASSWORD}@db:3306/dub'
      PLANETSCALE_DATABASE_URL: 'http://root:${DB_ROOT_PASSWORD}@planetscale-proxy:3900/dub'
      UPSTASH_REDIS_REST_URL: 'http://serverless-redis-http:80'
      UPSTASH_REDIS_REST_TOKEN: '${UPSTASH_TOKEN}'
      GOOGLE_CLIENT_ID: '${GOOGLE_CLIENT_ID}'
      GOOGLE_CLIENT_SECRET: '${GOOGLE_CLIENT_SECRET}'
      RESEND_API_KEY: '${RESEND_API_KEY:-}'
      STORAGE_ACCESS_KEY_ID: '${STORAGE_ACCESS_KEY_ID}'
      STORAGE_SECRET_ACCESS_KEY: '${STORAGE_SECRET_ACCESS_KEY}'
      STORAGE_ENDPOINT: '${STORAGE_ENDPOINT}'
      STORAGE_REGION: '${STORAGE_REGION:-auto}'
      STORAGE_PUBLIC_BUCKET: '${STORAGE_PUBLIC_BUCKET}'
      STORAGE_PRIVATE_BUCKET: '${STORAGE_PRIVATE_BUCKET}'
      STORAGE_BASE_URL: '${STORAGE_BASE_URL}'
    depends_on:
      db:
        condition: service_healthy
      planetscale-proxy:
        condition: service_started
      serverless-redis-http:
        condition: service_healthy

  db:
    # 8.0, not 8: mysql_native_password is gone in 8.4 and ps-http-sim's client needs it
    image: mysql:8.0
    restart: unless-stopped
    labels:
      traefik.enable: "false"
    command: ["--default-authentication-plugin=mysql_native_password"]
    ports:
      - "127.0.0.1:${DB_HOST_PORT:-3307}:3306"
    networks:
      - default
      - shared-db-network
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD}
      MYSQL_DATABASE: dub
    volumes:
      - mysqldata:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 5s
      timeout: 3s
      retries: 10

  # translates PlanetScale's HTTP API into plain MySQL — required by the edge
  # runtime middleware, which cannot open a TCP socket to the database.
  planetscale-proxy:
    image: ghcr.io/mattrobenolt/ps-http-sim:v0.0.12
    restart: unless-stopped
    labels:
      traefik.enable: "false"
    command:
      - "-listen-addr=0.0.0.0"
      - "-listen-port=3900"
      - "-mysql-addr=db"
      - "-mysql-port=3306"
      - "-mysql-dbname=dub"
    depends_on:
      db:
        condition: service_healthy

  # redis is not used directly by dub, but is required by the planetscale-proxy
  redis:
    image: redis:7-alpine
    restart: unless-stopped
    labels:
      traefik.enable: "false"
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5

  # exposes Redis over the Upstash REST API that dub's client expects.
  serverless-redis-http:
    image: hiett/serverless-redis-http:latest
    restart: unless-stopped
    labels:
      traefik.enable: "false"
    environment:
      SRH_MODE: env
      SRH_TOKEN: ${UPSTASH_TOKEN}
      SRH_CONNECTION_STRING: "redis://redis:6379"
    healthcheck:
      test: ["CMD-SHELL", "nc -z 127.0.0.1 80"]
      interval: 15s
      timeout: 3s
      retries: 3
      start_period: 20s
    depends_on:
      redis:
        condition: service_healthy

networks:
  shared-db-network:
    external: true

volumes:
  mysqldata:
  redisdata:
