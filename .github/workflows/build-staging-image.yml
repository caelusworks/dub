name: Build staging image

on:
  push:
    branches: [staging]
  workflow_dispatch:

concurrency:
  group: build-staging-${{ github.ref }}
  cancel-in-progress: true

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v4

      - id: vars
        run: echo "sha7=${GITHUB_SHA:0:7}" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=staging-latest
            type=raw,value=staging-${{ steps.vars.outputs.sha7 }}

      - uses: docker/build-push-action@v6
        with:
          context: .
          target: runner
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          platforms: linux/amd64
          provenance: false
          build-args: |
            NEXT_PUBLIC_APP_DOMAIN=${{ vars.NEXT_PUBLIC_APP_DOMAIN }}
            NEXT_PUBLIC_APP_SHORT_DOMAIN=${{ vars.NEXT_PUBLIC_APP_SHORT_DOMAIN }}
            DATABASE_URL=mysql://root:build@db:3306/dub
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Pin Coolify to this image
        if: ${{ vars.COOLIFY_SERVICE_UUID != '' }}
        env:
          IMAGE_REF: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:staging-${{ steps.vars.outputs.sha7 }}
        run: |
          curl --fail --silent --show-error -X PATCH \
            -H "Authorization: Bearer ${{ secrets.COOLIFY_API_TOKEN }}" \
            --json "$(jq -nc --arg v "$IMAGE_REF" '{key:"DUB_IMAGE",value:$v}')" \
            "${{ vars.COOLIFY_BASE_URL }}/api/v1/services/${{ vars.COOLIFY_SERVICE_UUID }}/envs"

      - name: Trigger Coolify deploy
        if: ${{ vars.COOLIFY_SERVICE_UUID != '' }}
        run: |
          curl --fail --silent --show-error -X POST \
            -H "Authorization: Bearer ${{ secrets.COOLIFY_API_TOKEN }}" \
            "${{ vars.COOLIFY_BASE_URL }}/api/v1/deploy?uuid=${{ vars.COOLIFY_SERVICE_UUID }}"
