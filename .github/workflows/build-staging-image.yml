name: Build staging image

on:
  push:
    branches: [staging]
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    concurrency:
      group: build-staging-${{ github.ref }}
      cancel-in-progress: true
    outputs:
      image: ${{ steps.vars.outputs.image }}
      sha7: ${{ steps.vars.outputs.sha7 }}

    steps:
      - uses: actions/checkout@v4

      - id: vars
        run: |
          sha7="${GITHUB_SHA:0:7}"
          echo "sha7=$sha7" >> "$GITHUB_OUTPUT"
          echo "image=${REGISTRY}/${IMAGE_NAME}:staging-${sha7}" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=staging-latest
            type=raw,value=staging-${{ steps.vars.outputs.sha7 }}

      - uses: docker/build-push-action@v6
        with:
          context: .
          target: runner
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          platforms: linux/amd64
          provenance: false
          build-args: |
            NEXT_PUBLIC_APP_DOMAIN=${{ vars.NEXT_PUBLIC_APP_DOMAIN }}
            NEXT_PUBLIC_APP_SHORT_DOMAIN=${{ vars.NEXT_PUBLIC_APP_SHORT_DOMAIN }}
            DATABASE_URL=mysql://root:build@db:3306/dub
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Summary
        run: |
          {
            echo "### Image"
            echo '`${{ steps.vars.outputs.image }}`'
          } >> "$GITHUB_STEP_SUMMARY"

  deploy:
    needs: build
    if: ${{ vars.COOLIFY_SERVICE_UUID != '' }}
    runs-on: ubuntu-latest
    permissions: {}
    environment: staging
    concurrency:
      group: deploy-staging
      cancel-in-progress: false

    steps:
      - name: Pin Coolify to this image
        env:
          IMAGE_REF: ${{ needs.build.outputs.image }}
          COOLIFY_TOKEN: ${{ secrets.COOLIFY_API_TOKEN }}
          COOLIFY_BASE_URL: ${{ vars.COOLIFY_BASE_URL }}
          COOLIFY_SERVICE_UUID: ${{ vars.COOLIFY_SERVICE_UUID }}
        run: |
          curl --fail --silent --show-error -X PATCH \
            -H "Authorization: Bearer $COOLIFY_TOKEN" \
            --json "$(jq -nc --arg v "$IMAGE_REF" '{key:"DUB_IMAGE",value:$v}')" \
            "$COOLIFY_BASE_URL/api/v1/services/$COOLIFY_SERVICE_UUID/envs"

      - name: Trigger Coolify deploy
        env:
          COOLIFY_TOKEN: ${{ secrets.COOLIFY_API_TOKEN }}
          COOLIFY_BASE_URL: ${{ vars.COOLIFY_BASE_URL }}
          COOLIFY_SERVICE_UUID: ${{ vars.COOLIFY_SERVICE_UUID }}
        run: |
          curl --fail --silent --show-error -X POST \
            -H "Authorization: Bearer $COOLIFY_TOKEN" \
            "$COOLIFY_BASE_URL/api/v1/deploy?uuid=$COOLIFY_SERVICE_UUID"

      - name: Summary
        run: |
          {
            echo "### Deployed"
            echo '`${{ needs.build.outputs.image }}`'
          } >> "$GITHUB_STEP_SUMMARY"
